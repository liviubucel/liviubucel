name: Apply IdCard model asset fix

on:
  push:
    branches:
      - fix/idcard-model-asset-20260913

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/idcard-model-asset-20260913
          fetch-depth: 0
      - name: Point IdCard at Vite-managed model asset
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/components/ui/id-card.tsx')
          text = path.read_text()
          old = "const CARD_MODEL_URL = '/models/lanyard/card.glb'"
          new = "const CARD_MODEL_URL = new URL('../../assets/models/lanyard/card.glb', import.meta.url).href"
          if old not in text:
              raise SystemExit('Expected CARD_MODEL_URL declaration was not found')
          path.write_text(text.replace(old, new, 1))
          PY
          rm .github/workflows/apply-idcard-model-fix.yml
      - name: Commit fix
        run: |
          git config user.name 'Liviu Bucel'
          git config user.email '109367578+liviubucel@users.noreply.github.com'
          git add src/components/ui/id-card.tsx .github/workflows/apply-idcard-model-fix.yml
          git commit -m 'fix: serve Zolt lanyard model through Vite assets'
          git push origin HEAD:fix/idcard-model-asset-20260913
