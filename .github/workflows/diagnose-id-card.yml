name: Diagnose Zolt IdCard runtime

on:
  push:
    branches:
      - diagnose/id-card-runtime-20260913
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Install Chromium diagnostic harness
        run: |
          mkdir -p /tmp/pw
          cd /tmp/pw
          npm init -y >/dev/null 2>&1
          npm install playwright@1.57.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium
      - name: Diagnose live IdCard in Chromium
        run: |
          cat > /tmp/pw/diag.mjs <<'EOF'
          import { chromium } from 'playwright'

          const browser = await chromium.launch({
            headless: true,
            args: ['--use-angle=swiftshader', '--enable-webgl', '--ignore-gpu-blocklist']
          })
          const context = await browser.newContext({
            viewport: { width: 1728, height: 1000 },
            userAgent: 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/153.0.0.0 Safari/537.36'
          })
          const page = await context.newPage()
          const events = []

          page.on('console', msg => {
            const line = `[console:${msg.type()}] ${msg.text()}`
            events.push(line)
            console.log(line)
          })
          page.on('pageerror', err => {
            const line = `[pageerror] ${err.stack || err.message}`
            events.push(line)
            console.log(line)
          })
          page.on('requestfailed', req => {
            const line = `[requestfailed] ${req.url()} :: ${req.failure()?.errorText}`
            events.push(line)
            console.log(line)
          })
          page.on('response', res => {
            const u = res.url()
            if (/id-card|rapier|\.wasm|\.glb|3d-card|profile\.webp|pin\.webp|_astro/i.test(u)) {
              console.log(`[response] ${res.status()} ${res.headers()['content-type'] || ''} ${u}`)
            }
          })

          const target = `https://www.liviubucel.com/?idcard_diag=${Date.now()}`
          const response = await page.goto(target, { waitUntil: 'domcontentloaded', timeout: 90000 })
          console.log(`[document] status=${response?.status()} url=${page.url()}`)
          console.log('[csp]', await response?.headerValue('content-security-policy'))
          await page.waitForTimeout(15000)

          const state = await page.evaluate(() => {
            const section = document.querySelector('[data-hero-id-card]')
            const canvas = section?.querySelector('canvas')
            const fallback = document.getElementById('hero-id-card-fallback')
            const island = section?.querySelector('astro-island')
            let gl = null
            let lost = null
            let renderer = null
            let centerPixel = null
            if (canvas) {
              try {
                gl = canvas.getContext('webgl2') || canvas.getContext('webgl')
                lost = gl ? gl.isContextLost() : null
                renderer = gl ? gl.getParameter(gl.RENDERER) : null
                if (gl) {
                  const p = new Uint8Array(4)
                  gl.readPixels(Math.floor(canvas.width / 2), Math.floor(canvas.height / 2), 1, 1, gl.RGBA, gl.UNSIGNED_BYTE, p)
                  centerPixel = Array.from(p)
                }
              } catch (error) {
                gl = { error: String(error) }
              }
            }
            return {
              title: document.title,
              bodyLength: document.body.innerHTML.length,
              section: Boolean(section),
              canvasCount: section?.querySelectorAll('canvas').length ?? 0,
              canvasWidth: canvas?.width ?? null,
              canvasHeight: canvas?.height ?? null,
              canvasRect: canvas ? canvas.getBoundingClientRect().toJSON() : null,
              webgl: Boolean(gl && !gl.error),
              contextLost: lost,
              renderer,
              centerPixel,
              fallbackReady: fallback?.dataset.canvasReady ?? null,
              fallbackDisplay: fallback ? getComputedStyle(fallback).display : null,
              fallbackOpacity: fallback ? getComputedStyle(fallback).opacity : null,
              islandHasError: island?.hasAttribute('ssr') === false && !canvas,
              islandHTML: island?.outerHTML?.slice(0, 1800) ?? null
            }
          })
          console.log('[state]', JSON.stringify(state, null, 2))
          console.log('[errors]', JSON.stringify(events.filter(line => /pageerror|requestfailed|error/i.test(line)), null, 2))

          await page.screenshot({ path: '/tmp/id-card-diagnostic.png', fullPage: false })
          await browser.close()
          EOF
          cd /tmp/pw
          node diag.mjs
      - name: Upload diagnostic screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: id-card-diagnostic
          path: /tmp/id-card-diagnostic.png
          if-no-files-found: ignore
