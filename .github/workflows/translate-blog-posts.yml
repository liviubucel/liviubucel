name: Translate blog posts to Romanian

on:
  workflow_dispatch:
    inputs:
      limit:
        description: "Max posts to translate in this run (each run only picks up untranslated ones, so re-running is safe)"
        required: false
        default: "10"
  schedule:
    - cron: "0 5 * * *"

jobs:
  translate:
    name: Translate untranslated posts
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.33.0 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Translate posts missing a Romanian version
        run: pnpm blog:translate -- --limit "${LIMIT}"
        env:
          LIMIT: ${{ github.event.inputs.limit || '10' }}
          PUBLIC_SANITY_PROJECT_ID: ${{ vars.SANITY_PROJECT_ID }}
          SANITY_DATASET: ${{ vars.SANITY_DATASET }}
          SANITY_API_WRITE_TOKEN: ${{ secrets.SANITY_API_WRITE_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
