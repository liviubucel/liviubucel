name: Trigger Romania Cyber Monitor sync

on:
  workflow_dispatch:

jobs:
  trigger-sync:
    name: Run sync now
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Call the manual trigger endpoint
        run: |
          if [ -z "${TRIGGER_TOKEN}" ]; then
            echo "::error::CYBER_MONITOR_TRIGGER_TOKEN repository secret is not set. Add it in Settings > Secrets and variables > Actions with the same value used for 'wrangler secret put CYBER_MONITOR_TRIGGER_TOKEN'."
            exit 1
          fi

          # -L follows Cloudflare's edge redirect (e.g. bot-protection
          # challenges on the default curl UA); --post301/302/303 makes
          # curl keep POST + headers across every redirect status instead
          # of silently downgrading to GET.
          http_code=$(curl -sS -L --post301 --post302 --post303 \
            -o response.json -w "%{http_code}" -X POST \
            "https://liviubucel.com/api/cyber-monitor/trigger-sync" \
            -H "Authorization: Bearer ${TRIGGER_TOKEN}" \
            -H "User-Agent: liviubucel-website-ops/1.0")

          echo "HTTP status: ${http_code}"
          echo "Response:"
          cat response.json
          echo

          if [ "${http_code}" -ge 300 ]; then
            echo "::error::Sync trigger failed with HTTP ${http_code}"
            exit 1
          fi
        env:
          TRIGGER_TOKEN: ${{ secrets.CYBER_MONITOR_TRIGGER_TOKEN }}
