name: Deploy Cloudflare production

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Build, migrate, deploy and smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '22'

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.34.0 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Unit tests
        run: pnpm test

      - name: Astro type check
        run: pnpm check

      - name: Production build
        run: pnpm build
        env:
          SANITY_PROJECT_ID: ${{ vars.SANITY_PROJECT_ID }}
          SANITY_DATASET: production
          SITE_URL: https://www.liviubucel.com/

      - name: Apply D1 migrations
        run: pnpm exec wrangler d1 migrations apply ROMANIA_MONITOR_DB --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy Worker with Wrangler
        run: pnpm exec wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Wait for edge propagation
        run: sleep 12

      - name: Production smoke tests
        run: |
          set -euo pipefail

          BASE='https://www.liviubucel.com'
          UA='site-deployment-smoke/1.0'

          HOME_STATUS=$(curl -sS -o /dev/null -w '%{http_code}' -H "User-Agent: ${UA}" "${BASE}/?deploy_sha=${GITHUB_SHA}")
          EXPERIENCE_STATUS=$(curl -sS -o /dev/null -w '%{http_code}' -H "User-Agent: ${UA}" "${BASE}/experience?deploy_sha=${GITHUB_SHA}")

          if [ "$HOME_STATUS" != '200' ]; then
            echo "::error::Homepage returned HTTP ${HOME_STATUS}"
            exit 1
          fi

          if [ "$EXPERIENCE_STATUS" != '200' ]; then
            echo "::error::Experience page returned HTTP ${EXPERIENCE_STATUS}"
            exit 1
          fi

          HEADERS=$(curl -sS -D - -o /dev/null -H "User-Agent: ${UA}" "${BASE}/romania-cyber-monitor?lang=ro")
          LOCATION=$(printf '%s\n' "$HEADERS" | awk 'BEGIN{IGNORECASE=1} /^location:/ {sub(/\r$/, "", $2); print $2; exit}')
          if [ "$LOCATION" != "${BASE}/ro/romania-cyber-monitor" ]; then
            echo "::error::Language redirect is wrong."
            exit 1
          fi

          RO_STATUS=$(curl -sS -o /dev/null -w '%{http_code}' -H "User-Agent: ${UA}" "${BASE}/ro/romania-cyber-monitor")
          if [ "$RO_STATUS" != '200' ]; then
            echo "::error::Romanian Cyber Monitor returned HTTP ${RO_STATUS}"
            exit 1
          fi

          echo "Production smoke tests passed."
