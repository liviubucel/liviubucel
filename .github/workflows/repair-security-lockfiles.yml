name: Repair security lockfiles

on:
  push:
    branches: ['agent/security-cleanup-20260828']
    paths:
      - '.github/workflows/repair-security-lockfiles.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/security-cleanup-20260828

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          package-manager-cache: false

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.34.0 --activate

      - name: Regenerate root lockfile safely
        run: pnpm install --lockfile-only --no-frozen-lockfile --ignore-scripts

      - name: Regenerate Studio lockfile safely
        working-directory: studio-liviubucel
        run: pnpm install --ignore-workspace --lockfile-only --no-frozen-lockfile --ignore-scripts

      - name: Commit generated lockfiles
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add pnpm-lock.yaml studio-liviubucel/pnpm-lock.yaml
          if git diff --cached --quiet; then
            echo 'Lockfiles already match package security configuration.'
            exit 0
          fi
          git commit -m 'chore: regenerate hardened pnpm lockfiles'
          git push origin HEAD:agent/security-cleanup-20260828
