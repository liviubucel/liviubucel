name: Probe Wix Marketing Consent Headless

on:
  push:
    branches:
      - migration/full-wix
    paths:
      - '.github/workflows/probe-wix-marketing-consent-headless.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.34.0 --activate
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Require visitor OAuth double-confirmation support
        env:
          PUBLIC_WIX_CLIENT_ID: fa19f377-c994-45c3-935b-235f41858d0f
        run: |
          node --input-type=module <<'NODE'
          import { createClient, OAuthStrategy } from '@wix/sdk';

          const client = createClient({
            auth: OAuthStrategy({ clientId: process.env.PUBLIC_WIX_CLIENT_ID }),
          });
          const email = 'headless-consent-probe-final@example.com';
          const response = await client.fetchWithAuth(
            'https://www.wixapis.com/marketing-consent/v1/marketing-consent/upsert',
            {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({
                marketingConsent: {
                  details: { type: 'EMAIL', email },
                  state: 'PENDING',
                  lastConfirmationActivity: {
                    source: 'FORM',
                    description: 'Headless Wix migration permission probe.',
                    updatedDate: new Date().toISOString(),
                    optInLevel: 'DOUBLE_CONFIRMATION',
                  },
                },
              }),
            }
          );

          const text = await response.text();
          if (!response.ok) {
            throw new Error(`Marketing consent upsert failed: HTTP ${response.status} ${text}`);
          }
          const data = JSON.parse(text);
          if (data.marketingConsent?.state !== 'PENDING') {
            throw new Error(`Expected PENDING consent, got ${data.marketingConsent?.state}`);
          }
          if (data.marketingConsent?.lastConfirmationActivity?.optInLevel !== 'DOUBLE_CONFIRMATION') {
            throw new Error(`Expected DOUBLE_CONFIRMATION, got ${data.marketingConsent?.lastConfirmationActivity?.optInLevel}`);
          }
          if (!data.link?.url) {
            throw new Error('Wix did not return a confirmation link for pending double opt-in consent.');
          }
          console.log('Headless OAuth supports PENDING + DOUBLE_CONFIRMATION and returns a confirmation link.');
          NODE
