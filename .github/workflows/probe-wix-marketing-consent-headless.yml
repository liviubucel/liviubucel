name: Probe Wix Marketing Consent Headless

on:
  push:
    branches:
      - migration/full-wix
    paths:
      - '.github/workflows/probe-wix-marketing-consent-headless.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.34.0 --activate
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Require full Wix double-opt-in email flow
        env:
          PUBLIC_WIX_CLIENT_ID: fa19f377-c994-45c3-935b-235f41858d0f
        run: |
          node --input-type=module <<'NODE'
          import { createClient, OAuthStrategy } from '@wix/sdk';

          const client = createClient({
            auth: OAuthStrategy({ clientId: process.env.PUBLIC_WIX_CLIENT_ID }),
          });
          const email = 'headless-consent-probe-final@example.com';

          const consentResponse = await client.fetchWithAuth(
            'https://www.wixapis.com/marketing-consent/v1/marketing-consent/upsert',
            {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({
                marketingConsent: {
                  details: { type: 'EMAIL', email },
                  state: 'PENDING',
                  lastConfirmationActivity: {
                    source: 'FORM',
                    description: 'Headless Wix migration permission probe.',
                    updatedDate: new Date().toISOString(),
                    optInLevel: 'DOUBLE_CONFIRMATION',
                  },
                },
              }),
            }
          );

          const consentText = await consentResponse.text();
          if (!consentResponse.ok) {
            throw new Error(`Marketing consent upsert failed: HTTP ${consentResponse.status} ${consentText}`);
          }
          const consentData = JSON.parse(consentText);
          if (consentData.marketingConsent?.state !== 'PENDING') {
            throw new Error(`Expected PENDING consent, got ${consentData.marketingConsent?.state}`);
          }
          if (consentData.marketingConsent?.lastConfirmationActivity?.optInLevel !== 'DOUBLE_CONFIRMATION') {
            throw new Error(`Expected DOUBLE_CONFIRMATION, got ${consentData.marketingConsent?.lastConfirmationActivity?.optInLevel}`);
          }
          const confirmationUrl = consentData.link?.url;
          if (!confirmationUrl) {
            throw new Error('Wix did not return a confirmation link for pending double opt-in consent.');
          }

          const transmissionResponse = await client.fetchWithAuth(
            'https://www.wixapis.com/email-transmissions/v1/email-transmissions/send',
            {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({
                emailTransmission: {
                  emailSubject: 'Confirm your Romania Cyber Monitor subscription',
                  emailHtmlContent: `<p>This is a migration probe.</p><p><a href="${confirmationUrl.replaceAll('&', '&amp;').replaceAll('"', '&quot;')}">Confirm subscription</a></p>`,
                  toRecipients: [{ emailAddress: email }],
                  type: 'TRANSACTIONAL',
                },
                idempotencyKey: consentData.marketingConsent.id,
              }),
            }
          );

          const transmissionText = await transmissionResponse.text();
          if (!transmissionResponse.ok) {
            throw new Error(`Email transmission failed: HTTP ${transmissionResponse.status} ${transmissionText}`);
          }
          const transmissionData = JSON.parse(transmissionText);
          if (transmissionData.emailTransmission?.status !== 'ACCEPTED') {
            throw new Error(`Expected ACCEPTED email transmission, got ${transmissionData.emailTransmission?.status}`);
          }

          console.log(`CONSENT_ID=${consentData.marketingConsent.id}`);
          console.log(`TRANSMISSION_ID=${transmissionData.emailTransmission.id}`);
          console.log('Full Wix double-opt-in email flow accepted.');
          NODE
