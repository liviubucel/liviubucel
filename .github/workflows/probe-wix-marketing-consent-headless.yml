name: Probe Wix Native Newsletter Headless

on:
  push:
    branches:
      - migration/full-wix
    paths:
      - '.github/workflows/probe-wix-marketing-consent-headless.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.34.0 --activate
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Require native Wix Forms double opt-in via visitor OAuth
        env:
          PUBLIC_WIX_CLIENT_ID: fa19f377-c994-45c3-935b-235f41858d0f
        run: |
          node --input-type=module <<'NODE'
          import { createClient, OAuthStrategy } from '@wix/sdk';

          const client = createClient({
            auth: OAuthStrategy({ clientId: process.env.PUBLIC_WIX_CLIENT_ID }),
          });

          const email = 'headless-native-form-probe-20260918@example.com';
          const formId = '4b8cab43-1038-4982-bd52-a1fe3553a0a6';

          const createResponse = await client.fetchWithAuth(
            'https://www.wixapis.com/forms/v4/submissions',
            {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({
                submission: {
                  formId,
                  submissions: {
                    email,
                    email_subscription: true,
                  },
                },
              }),
            }
          );

          const createText = await createResponse.text();
          if (!createResponse.ok) {
            throw new Error(`Create submission failed: HTTP ${createResponse.status} ${createText}`);
          }

          const createData = JSON.parse(createText);
          const submissionId = createData.submission?.id;
          let status = createData.submission?.status;

          if (!submissionId) {
            throw new Error('Wix Forms did not return a submission ID.');
          }

          if (status === 'PENDING') {
            const confirmResponse = await client.fetchWithAuth(
              `https://www.wixapis.com/forms/v4/submissions/${submissionId}/confirm`,
              {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: '{}',
              }
            );

            const confirmText = await confirmResponse.text();
            if (!confirmResponse.ok) {
              throw new Error(`Confirm submission failed: HTTP ${confirmResponse.status} ${confirmText}`);
            }

            const confirmData = JSON.parse(confirmText);
            status = confirmData.submission?.status;
          }

          if (status !== 'CONFIRMED') {
            throw new Error(`Expected CONFIRMED submission, got ${status}`);
          }

          console.log(`PROBE_EMAIL=${email}`);
          console.log(`SUBMISSION_ID=${submissionId}`);
          console.log(`FINAL_STATUS=${status}`);
          console.log('Native Wix Forms newsletter write path works with visitor OAuth.');
          NODE
