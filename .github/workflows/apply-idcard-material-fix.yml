name: Apply IdCard material atlas fix

on:
  push:
    branches:
      - fix/idcard-model-asset-20260913

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/idcard-model-asset-20260913
          fetch-depth: 0
      - name: Make card atlas resilient when GLB material has no map
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/components/ui/id-card.tsx')
          text = path.read_text()
          old = """  const cardMap = useMemo(() => {\n    const baseMap = materials.base.map as THREE.Texture\n    const baseImage = baseMap.image as HTMLImageElement\n    const width = baseImage.width\n    const height = baseImage.height\n\n    const canvas = document.createElement('canvas')\n\n    canvas.width = width\n    canvas.height = height\n\n    const ctx = canvas.getContext('2d')\n\n    if (!ctx) return baseMap\n\n    ctx.drawImage(baseImage, 0, 0, width, height)\n\n    const image = frontTexture.image as HTMLImageElement\n"""
          new = """  const cardMap = useMemo(() => {\n    const baseMap = materials.base.map as THREE.Texture | null\n    const baseImage = baseMap?.image as HTMLImageElement | undefined\n    const frontImage = frontTexture.image as HTMLImageElement\n\n    // Some production GLB loaders expose the material without its optional base texture map.\n    // The card face itself is fully replaced below, so we can safely build the UV atlas on a\n    // neutral canvas instead of crashing while reading `baseMap.image`. Keep a square atlas to\n    // preserve the model's baked UV rectangles exactly.\n    const width = baseImage?.width || 2048\n    const height = baseImage?.height || 2048\n\n    const canvas = document.createElement('canvas')\n\n    canvas.width = width\n    canvas.height = height\n\n    const ctx = canvas.getContext('2d')\n\n    if (!ctx) return baseMap ?? frontTexture\n\n    if (baseImage?.width && baseImage?.height) {\n      ctx.drawImage(baseImage, 0, 0, width, height)\n    } else {\n      ctx.fillStyle = isDark ? '#171717' : '#f5f5f5'\n      ctx.fillRect(0, 0, width, height)\n    }\n\n    const image = frontImage\n"""
          if old not in text:
              raise SystemExit('Expected cardMap block was not found')
          text = text.replace(old, new, 1)
          old2 = """    composite.colorSpace = THREE.SRGBColorSpace\n    composite.flipY = baseMap.flipY\n    composite.anisotropy = 16\n    composite.needsUpdate = true\n\n    return composite\n  }, [frontTexture, materials.base.map])\n"""
          new2 = """    composite.colorSpace = THREE.SRGBColorSpace\n    // glTF UVs use flipY=false. Preserve the embedded map setting when present, otherwise\n    // explicitly use the glTF convention for the generated canvas texture.\n    composite.flipY = baseMap?.flipY ?? false\n    composite.anisotropy = 16\n    composite.needsUpdate = true\n\n    return composite\n  }, [frontTexture, materials.base.map, isDark])\n"""
          if old2 not in text:
              raise SystemExit('Expected composite block was not found')
          path.write_text(text.replace(old2, new2, 1))
          PY
          rm .github/workflows/apply-idcard-material-fix.yml
      - name: Commit fix
        run: |
          git config user.name 'Liviu Bucel'
          git config user.email '109367578+liviubucel@users.noreply.github.com'
          git add src/components/ui/id-card.tsx .github/workflows/apply-idcard-material-fix.yml
          git commit -m 'fix: handle lanyard material without base texture'
          git push origin HEAD:fix/idcard-model-asset-20260913
