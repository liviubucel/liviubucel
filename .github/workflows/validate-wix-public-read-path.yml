name: Validate Wix CMS public read path

on:
  push:
    branches:
      - migration/full-wix
    paths:
      - '.github/workflows/validate-wix-public-read-path.yml'
      - 'src/lib/wix/**'
      - 'src/lib/content-queries.ts'
      - 'src/lib/cyber-monitor/public-data-wix.ts'
      - 'src/components/**'
      - 'src/layouts/**'
      - 'src/pages/**'
      - 'package.json'
      - 'pnpm-lock.yaml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.34.0 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Smoke test Wix Headless OAuth and Blog API
        shell: bash
        env:
          PUBLIC_WIX_CLIENT_ID: fa19f377-c994-45c3-935b-235f41858d0f
        run: |
          node --input-type=module <<'NODE'
          import { createClient, OAuthStrategy } from '@wix/sdk';

          const client = createClient({
            auth: OAuthStrategy({ clientId: process.env.PUBLIC_WIX_CLIENT_ID }),
          });

          const response = await client.fetchWithAuth('https://www.wixapis.com/v3/posts/query', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              fieldsets: ['CONTENT_TEXT', 'RICH_CONTENT'],
              query: { cursorPaging: { limit: 100 } },
            }),
          });

          if (!response.ok) {
            throw new Error(`Wix Blog OAuth smoke test failed: HTTP ${response.status} ${await response.text()}`);
          }

          const data = await response.json();
          const excluded = new Set([
            'creative-portfolio-showcase-tips-for-artists',
            'building-a-stunning-online-portfolio-best-practices',
            'maximizing-your-portfolio-impact-design-and-content',
          ]);
          const posts = (data.posts ?? []).filter((post) => !excluded.has(post.slug));
          const en = posts.filter((post) => post.language === 'en');
          const ro = posts.filter((post) => post.language === 'ro');

          if (posts.length !== 8 || en.length !== 2 || ro.length !== 6) {
            throw new Error(`Unexpected Wix Blog corpus: total=${posts.length}, en=${en.length}, ro=${ro.length}`);
          }
          if (posts.some((post) => !post.richContent?.nodes?.length)) {
            throw new Error('At least one migrated Wix Blog post has no Ricos content.');
          }

          console.log(`Wix Blog OAuth OK: ${posts.length} intended posts (${en.length} EN, ${ro.length} RO).`);
          NODE

      - name: Astro type check
        run: pnpm check
        env:
          PUBLIC_WIX_CLIENT_ID: fa19f377-c994-45c3-935b-235f41858d0f
          SANITY_PROJECT_ID: 8atrdwjk
          SANITY_DATASET: production
          SITE_URL: https://liviubucel-zebrabyte-0a09.wix-site-host.com/

      - name: Production build
        run: pnpm build
        env:
          PUBLIC_WIX_CLIENT_ID: fa19f377-c994-45c3-935b-235f41858d0f
          SANITY_PROJECT_ID: 8atrdwjk
          SANITY_DATASET: production
          SITE_URL: https://liviubucel-zebrabyte-0a09.wix-site-host.com/

      - name: Assert Wix migration boundaries
        shell: bash
        run: |
          set -euo pipefail
          if grep -R "ROMANIA_MONITOR_DB" src/pages/romania-cyber-monitor src/pages/ro/romania-cyber-monitor src/pages/blog src/pages/ro/blog; then
            echo 'Public Cyber Monitor pages still reference D1.'
            exit 1
          fi
          grep -R "public-data-wix" src/pages/romania-cyber-monitor src/pages/ro/romania-cyber-monitor src/pages/blog src/pages/ro/blog >/dev/null

          direct_sanity="$(grep -R -n "sanity-queries" src --include='*.ts' --include='*.tsx' --include='*.js' --include='*.astro' | grep -v 'src/lib/content-queries.ts' | grep -v 'src/lib/sanity-queries.ts' || true)"
          if [ -n "$direct_sanity" ]; then
            echo 'Frontend bypasses the Wix content facade:'
            echo "$direct_sanity"
            exit 1
          fi

          if grep -R "PortableText" src/pages/blog src/pages/ro/blog; then
            echo 'Blog detail pages still depend on Sanity Portable Text.'
            exit 1
          fi
          grep -q "fetchWithAuth('https://www.wixapis.com/v3/posts/query'" src/lib/content-queries.ts
          grep -q "v3/posts/slugs" src/lib/content-queries.ts

          test -f dist/server/entry.mjs
          test -d dist/client
