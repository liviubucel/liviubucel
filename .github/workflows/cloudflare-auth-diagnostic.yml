name: Cloudflare auth diagnostic

on:
  push:
    branches:
      - agent/security-cleanup-20260828

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          package-manager-cache: false

      - name: Enable Corepack
        run: |
          corepack enable
          corepack prepare pnpm@10.34.0 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate Cloudflare token only
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          if pnpm exec wrangler whoami >/dev/null 2>&1; then
            echo 'Cloudflare API token authentication: OK'
          else
            echo '::error::Cloudflare API token authentication failed without using CLOUDFLARE_ACCOUNT_ID.'
            exit 1
          fi

      - name: Validate D1 access without account ID
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          if pnpm exec wrangler d1 migrations list ROMANIA_MONITOR_DB --remote >/dev/null 2>&1; then
            echo 'Cloudflare D1 account resolution and read access: OK'
          else
            echo '::error::Token authenticates, but D1 access/account resolution fails without CLOUDFLARE_ACCOUNT_ID.'
            exit 2
          fi
