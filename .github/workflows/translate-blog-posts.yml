name: Repair and translate blog posts

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/translate-blog-posts.yml"
  workflow_dispatch:
    inputs:
      limit:
        description: "Max missing counterparts to create per language"
        required: false
        default: "20"
  schedule:
    - cron: "0 5 * * *"

jobs:
  translate:
    name: Normalize metadata and complete EN/RO pairs
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.33.0 --activate

      - name: Validate translation secrets
        shell: bash
        env:
          SANITY_API_WRITE_TOKEN: ${{ secrets.SANITY_API_WRITE_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          missing=0
          for name in SANITY_API_WRITE_TOKEN CLOUDFLARE_ACCOUNT_ID CLOUDFLARE_API_TOKEN; do
            if [ -z "${!name}" ]; then
              echo "::error::${name} is not configured in GitHub Actions secrets."
              missing=1
            fi
          done
          exit "${missing}"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Normalize legacy blog metadata
        run: pnpm blog:normalize
        env:
          PUBLIC_SANITY_PROJECT_ID: ${{ vars.SANITY_PROJECT_ID }}
          SANITY_DATASET: ${{ vars.SANITY_DATASET }}
          SANITY_API_WRITE_TOKEN: ${{ secrets.SANITY_API_WRITE_TOKEN }}

      - name: Complete missing English and Romanian counterparts
        shell: bash
        run: |
          set +e
          pnpm blog:translate -- --to en --limit "${LIMIT}"
          en_status=$?
          pnpm blog:translate -- --to ro --limit "${LIMIT}"
          ro_status=$?
          set -e

          if [ "${en_status}" -ne 0 ] || [ "${ro_status}" -ne 0 ]; then
            echo "::error::One or more translation directions reported failures (EN=${en_status}, RO=${ro_status})."
            exit 1
          fi
        env:
          LIMIT: ${{ github.event.inputs.limit || '20' }}
          PUBLIC_SANITY_PROJECT_ID: ${{ vars.SANITY_PROJECT_ID }}
          SANITY_DATASET: ${{ vars.SANITY_DATASET }}
          SANITY_API_WRITE_TOKEN: ${{ secrets.SANITY_API_WRITE_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
