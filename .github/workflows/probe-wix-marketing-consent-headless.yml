name: Probe Wix Newsletter Audience

on:
  push:
    branches:
      - migration/full-wix
    paths:
      - '.github/workflows/probe-wix-marketing-consent-headless.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.34.0 --activate
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Submit native Wix newsletter form as a visitor
        env:
          PUBLIC_WIX_CLIENT_ID: fa19f377-c994-45c3-935b-235f41858d0f
        run: |
          node --input-type=module <<'NODE'
          import { createClient, OAuthStrategy } from '@wix/sdk';

          const client = createClient({
            auth: OAuthStrategy({ clientId: process.env.PUBLIC_WIX_CLIENT_ID }),
          });

          const email = 'newsletter-audience-e2e-20260918@example.com';
          const response = await client.fetchWithAuth(
            'https://www.wixapis.com/forms/v4/submissions',
            {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({
                submission: {
                  formId: '4b8cab43-1038-4982-bd52-a1fe3553a0a6',
                  submissions: {
                    email,
                    email_subscription: true,
                  },
                },
              }),
            }
          );

          const text = await response.text();
          if (!response.ok) {
            throw new Error(`Create submission failed: HTTP ${response.status} ${text}`);
          }

          const data = JSON.parse(text);
          if (!data.submission?.id) {
            throw new Error('Wix Forms did not return a submission ID.');
          }
          if (!['PENDING', 'CONFIRMED'].includes(data.submission?.status)) {
            throw new Error(`Unexpected submission status: ${data.submission?.status}`);
          }

          console.log(`PROBE_EMAIL=${email}`);
          console.log(`SUBMISSION_ID=${data.submission.id}`);
          console.log(`INITIAL_STATUS=${data.submission.status}`);
          NODE
