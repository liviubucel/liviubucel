name: Debug homepage check (temporary)

on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Fetch homepage and inspect
        run: |
          echo "=== Response headers ==="
          curl -sS -D - -o /tmp/body.html "https://www.liviubucel.com/" \
            -H "User-Agent: liviubucel-website-ops/1.0 (debug)" \
            -w "\nHTTP_CODE:%{http_code}\n"

          echo
          echo "=== _astro script/link references in HTML ==="
          grep -oE '/_astro/[A-Za-z0-9._-]+\.(js|css)' /tmp/body.html | sort -u

          echo
          echo "=== First 40 lines of body ==="
          head -40 /tmp/body.html

          echo
          echo "=== Probe one referenced JS asset directly ==="
          ASSET=$(grep -oE '/_astro/[A-Za-z0-9._-]+\.js' /tmp/body.html | head -1)
          if [ -n "$ASSET" ]; then
            echo "Probing: https://www.liviubucel.com${ASSET}"
            curl -sS -D - -o /dev/null "https://www.liviubucel.com${ASSET}" -w "\nHTTP_CODE:%{http_code}\n"
          else
            echo "No _astro asset reference found in HTML."
          fi
