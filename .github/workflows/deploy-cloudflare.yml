name: Deploy Cloudflare production

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-production
  cancel-in-progress: false

env:
  NODE_VERSION: '22'
  PNPM_VERSION: '10.34.0'

jobs:
  deploy:
    name: Build, migrate, deploy and smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@${PNPM_VERSION} --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Enforce pnpm-only lockfile policy
        run: pnpm security:lockfiles

      - name: Dependency audit (moderate+)
        run: pnpm security:audit

      - name: Unit tests
        run: pnpm test

      - name: Astro type check
        run: pnpm check

      - name: Production build
        run: pnpm build
        env:
          SANITY_PROJECT_ID: ${{ vars.SANITY_PROJECT_ID }}
          SANITY_DATASET: production
          SITE_URL: https://www.liviubucel.com/

      - name: Detect D1 migration changes
        id: d1_changes
        shell: bash
        run: |
          set -euo pipefail

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Manual deploy: D1 migrations are not applied automatically."
            exit 0
          fi

          BEFORE='${{ github.event.before }}'
          if [ -z "$BEFORE" ] || [[ "$BEFORE" =~ ^0+$ ]]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "No usable previous commit; D1 migration check will run."
            exit 0
          fi

          if git diff --quiet "$BEFORE" "$GITHUB_SHA" -- migrations/; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No D1 migration changes detected."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "D1 migration changes detected."
          fi

      - name: Apply D1 migrations
        if: steps.d1_changes.outputs.changed == 'true'
        run: pnpm exec wrangler d1 migrations apply ROMANIA_MONITOR_DB --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy Worker with Wrangler
        run: pnpm exec wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Wait for edge propagation
        run: sleep 12

      - name: Production smoke tests
        run: |
          set -euo pipefail

          # requests to workers.dev are intentionally redirected by application middleware to
          # the canonical www host. Treat that canonical redirect as the Worker health signal.
          # The public hostname is protected by Cloudflare WAF/Bot rules and can legitimately
          # return 403 to GitHub-hosted runners.
          WORKER_BASE='https://liviubucel-website.zebrabyte-uk.workers.dev'
          PUBLIC_BASE='https://www.liviubucel.com'
          UA='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/153.0.0.0 Safari/537.36'

          check_worker_redirect() {
            local path="$1"
            local headers status location
            headers=$(curl -sS -D - -o /dev/null -H "User-Agent: ${UA}" "${WORKER_BASE}${path}")
            status=$(printf '%s\n' "$headers" | awk 'NR==1 {print $2}')
            location=$(printf '%s\n' "$headers" | awk 'BEGIN{IGNORECASE=1} /^location:/ {sub(/\r$/, "", $2); print $2; exit}')

            case "$status" in
              301|302|307|308) ;;
              *)
                echo "::error::Worker ${path} returned HTTP ${status}; expected canonical redirect."
                exit 1
                ;;
            esac

            case "$location" in
              https://www.liviubucel.com/*|https://www.liviubucel.com)
                echo "Worker ${path} canonical redirect OK: ${status}."
                ;;
              *)
                echo "::error::Worker ${path} redirected to unexpected location: ${location}"
                exit 1
                ;;
            esac
          }

          check_worker_redirect '/?deploy_sha='"${GITHUB_SHA}"
          check_worker_redirect '/experience?deploy_sha='"${GITHUB_SHA}"

          PUBLIC_STATUS=$(curl -sS -o /dev/null -w '%{http_code}' -H "User-Agent: ${UA}" "${PUBLIC_BASE}/?deploy_sha=${GITHUB_SHA}")
          case "$PUBLIC_STATUS" in
            200|301|302|307|308)
              echo "Public hostname reachable: HTTP ${PUBLIC_STATUS}."
              ;;
            403)
              echo "::warning::Public hostname returned HTTP 403 to the GitHub runner (WAF/Bot protection). Worker canonical redirects passed."
              ;;
            *)
              echo "::error::Public hostname returned unexpected HTTP ${PUBLIC_STATUS}"
              exit 1
              ;;
          esac

          echo "Production smoke tests passed."
