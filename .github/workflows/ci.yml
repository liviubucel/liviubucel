name: CI/CD

on:
  push:
    branches: [main, develop, 'claude/**', 'agent/**']
  pull_request:

permissions:
  contents: read

env:
  NODE_VERSION: '22'
  PNPM_VERSION: '10.34.0'

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-test:
    name: Lint, Test & Dependency Audit
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false

      - name: Enable Corepack
        run: |
          corepack enable
          corepack prepare pnpm@${PNPM_VERSION} --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Enforce pnpm-only lockfile policy
        run: pnpm security:lockfiles

      - name: Run ESLint
        run: pnpm eslint

      - name: Type check
        run: pnpm check

      - name: Run unit tests
        run: pnpm test

      - name: Audit all root dependencies (moderate+)
        run: pnpm security:audit

  secret-scan:
    name: Secret Scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Scan repository history for secrets
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  studio-check:
    name: Sanity Studio Check & Dependency Audit
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false

      - name: Enable Corepack
        run: |
          corepack enable
          corepack prepare pnpm@${PNPM_VERSION} --activate

      - name: Enforce pnpm-only lockfile policy
        run: node scripts/check-lockfiles.mjs

      - name: Prepare isolated Studio workspace
        run: |
          mkdir -p "${RUNNER_TEMP}/sanity-studio"
          cp -R studio-liviubucel/. "${RUNNER_TEMP}/sanity-studio/"

      - name: Install Studio dependencies
        run: pnpm install --ignore-workspace --frozen-lockfile
        working-directory: ${{ runner.temp }}/sanity-studio

      - name: Type check Studio
        run: pnpm check
        working-directory: ${{ runner.temp }}/sanity-studio

      - name: Audit all Studio dependencies (moderate+)
        run: pnpm audit --ignore-workspace --audit-level moderate
        working-directory: ${{ runner.temp }}/sanity-studio

      - name: Build Studio
        run: pnpm build
        working-directory: ${{ runner.temp }}/sanity-studio

  build:
    name: Build & Security Check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [lint-and-test, secret-scan, studio-check]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false

      - name: Enable Corepack
        run: |
          corepack enable
          corepack prepare pnpm@${PNPM_VERSION} --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Audit i18n
        run: pnpm i18n:audit

      - name: Security scan
        run: pnpm security:scan

      - name: Build without production secrets
        run: pnpm build
        env:
          SANITY_DATASET: production
          SITE_URL: https://www.liviubucel.com/

  lighthouse:
    name: Lighthouse Audit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: build
    if: github.event_name == 'pull_request'

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false

      - name: Enable Corepack
        run: |
          corepack enable
          corepack prepare pnpm@${PNPM_VERSION} --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build without production secrets
        run: pnpm build
        env:
          SANITY_DATASET: production
          SITE_URL: https://www.liviubucel.com/

      - name: Run Lighthouse
        uses: treosh/lighthouse-ci-action@3e7e23fb74242897f95c0ba9cabad3d0227b9b18 # v12
        with:
          configPath: './.lighthouserc.json'
          uploadArtifacts: false
