name: Export Wix migration data

on:
  push:
    branches:
      - migration/full-wix
    paths:
      - '.github/workflows/export-wix-migration-data.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    name: Export public migration data
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Export public Sanity content
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p migration-export
          node --input-type=module <<'NODE'
          import fs from 'node:fs';

          const projectId = '8atrdwjk';
          const dataset = 'production';
          const apiVersion = '2025-02-20';
          const query = `{
            "posts": *[_type == "post"] | order(pubDate desc) {
              _id, title, "slug": slug.current, language, description, metaDescription,
              keywords, pubDate, updatedAt, tags, body, published,
              "featuredImageUrl": featuredImage.asset->url,
              "category": category->{title, "slug": slug.current},
              "author": author->{name, email}
            },
            "projects": *[_type == "project"] | order(pubDate desc) {
              _id, title, "slug": slug.current, language, description, metaDescription,
              tags, body, links, featured, pubDate,
              "featuredImageUrl": featuredImage.asset->url
            },
            "authors": *[_type == "author"] {
              _id, name, "slug": slug.current, bio, "imageUrl": image.asset->url
            },
            "categories": *[_type == "category"] {
              _id, title, "slug": slug.current, description
            },
            "certifications": *[_type == "certification"] | order(order asc, _createdAt asc) {
              _id, name, issuer, status, iconType, order, credentialUrl
            },
            "profileSettings": *[_type == "profileSettings"][0] {
              _id, isCurrentlyEmployed, "cvUrl": cvFile.asset->url, phone,
              github, linkedin, twitter, youtube, tryhackme, openToWorkMessage
            },
            "settings": *[_type == "settings"][0] {
              title, description, "ogImageUrl": ogImage.asset->url,
              "authorName": author->name
            },
            "pageSeo": *[_type == "pageSeo"] {
              _id, pageId, title, description, keywords, "ogImageUrl": ogImage.asset->url
            }
          }`;

          const url = `https://${projectId}.api.sanity.io/v${apiVersion}/data/query/${dataset}?query=${encodeURIComponent(query)}`;
          const response = await fetch(url);
          if (!response.ok) throw new Error(`Sanity export failed: ${response.status} ${response.statusText}`);
          const payload = await response.json();
          fs.writeFileSync('migration-export/sanity-public.json', JSON.stringify(payload.result, null, 2));
          console.log('Sanity public content exported.');
          NODE

      - name: Export public Cyber Monitor tables from D1
        id: d1_export
        continue-on-error: true
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p migration-export/d1
          node --input-type=module <<'NODE'
          import fs from 'node:fs';

          const apiToken = process.env.CLOUDFLARE_API_TOKEN;
          if (!apiToken) throw new Error('Cloudflare API token is unavailable.');

          const headers = {
            Authorization: `Bearer ${apiToken}`,
            'Content-Type': 'application/json'
          };

          const accountsResponse = await fetch('https://api.cloudflare.com/client/v4/accounts?per_page=50', { headers });
          const accountsPayload = await accountsResponse.json();
          if (!accountsResponse.ok || accountsPayload.success === false) {
            throw new Error(`Unable to enumerate Cloudflare accounts: HTTP ${accountsResponse.status}; ${JSON.stringify(accountsPayload.errors ?? [])}`);
          }

          const accounts = accountsPayload.result ?? [];
          let selected = null;
          for (const account of accounts) {
            const listUrl = `https://api.cloudflare.com/client/v4/accounts/${account.id}/d1/database?name=${encodeURIComponent('romania-cyber-monitor')}&per_page=100`;
            const dbResponse = await fetch(listUrl, { headers });
            const dbPayload = await dbResponse.json();
            if (!dbResponse.ok || dbPayload.success === false) continue;
            const database = (dbPayload.result ?? []).find(db => db.name === 'romania-cyber-monitor');
            if (database) {
              selected = { accountId: account.id, databaseId: database.uuid ?? database.id, databaseName: database.name };
              break;
            }
          }

          if (!selected?.accountId || !selected?.databaseId) {
            throw new Error('Could not find romania-cyber-monitor in any Cloudflare account accessible to this API token.');
          }

          const tables = [
            'sources', 'organisations', 'organisation_aliases', 'organisation_domains',
            'romanian_asns', 'incidents', 'incident_sources', 'exposures', 'indicators',
            'malware_metadata', 'aggregate_statistics'
          ];

          const counts = {};
          const endpoint = `https://api.cloudflare.com/client/v4/accounts/${selected.accountId}/d1/database/${selected.databaseId}/query`;
          for (const table of tables) {
            const response = await fetch(endpoint, {
              method: 'POST',
              headers,
              body: JSON.stringify({ sql: `SELECT * FROM ${table};` })
            });
            const payload = await response.json();
            if (!response.ok || payload.success === false) {
              throw new Error(`D1 export failed for ${table}: HTTP ${response.status}; ${JSON.stringify(payload.errors ?? [])}`);
            }
            const rows = Array.isArray(payload.result) ? (payload.result[0]?.results ?? []) : [];
            counts[table] = rows.length;
            fs.writeFileSync(`migration-export/d1/${table}.json`, JSON.stringify(rows, null, 2));
          }

          fs.writeFileSync('migration-export/d1-summary.json', JSON.stringify({ databaseName: selected.databaseName, counts }, null, 2));
          console.log('D1 public data export completed.');
          NODE

      - name: Record export manifest
        if: always()
        shell: bash
        run: |
          cat > migration-export/MANIFEST.txt <<EOF
          Wix migration export for liviubucel.com.

          Included:
          - Public/editorial Sanity content needed for Blog, Portfolio, profile, certifications, and page SEO.
          - Public Cyber Monitor D1 tables when Cloudflare token permissions permit read access.

          D1 step outcome: ${{ steps.d1_export.outcome }}

          Explicitly excluded:
          - newsletter_subscribers
          - cv_download_tokens
          - cv_request_rate_limits
          - guestbook entries (may contain visitor email addresses)
          - sync/audit/lock operational tables
          EOF

      - name: Upload migration export
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wix-migration-export
          path: migration-export/
          if-no-files-found: error
          retention-days: 1
