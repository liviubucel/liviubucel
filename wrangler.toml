name = "liviubucel-website"
main = "workers/entry.ts"
compatibility_date = "2026-07-21"
compatibility_flags = [ "nodejs_compat" ]

[observability]
enabled = true
head_sampling_rate = 1

[observability.logs]
enabled = true
head_sampling_rate = 1
persist = true
invocation_logs = true

[observability.traces]
enabled = true
persist = true
head_sampling_rate = 0.01

[vars]
SANITY_PROJECT_ID="8atrdwjk"
SANITY_DATASET="production"
CONTACT_TO_EMAIL="contact@liviubucel.com"
CONTACT_FROM_EMAIL="noreply@liviubucel.com"
NEWSLETTER_FROM_EMAIL="newsletter@liviubucel.com"

SOURCE_RANSOMWARE_LIVE_ENABLED="true"
SOURCE_HIBP_ENABLED="true"
SOURCE_LEAKIX_ENABLED="false"
SOURCE_THREATFOX_ENABLED="false"
SOURCE_URLHAUS_ENABLED="false"
SOURCE_MALWAREBAZAAR_ENABLED="false"
SOURCE_MISP_ENABLED="false"
SOURCE_ENISA_CIRAS_ENABLED="false"

[[send_email]]
name = "EMAIL"

[ai]
binding = "AI"

[[d1_databases]]
binding = "ROMANIA_MONITOR_DB"
database_name = "romania-cyber-monitor"
database_id = "5816fc15-7d65-41cf-adbf-54f42ae4aa5a"
migrations_dir = "migrations"

[triggers]
crons = [
  "30 * * * *",
  "0 */6 * * *",
  "0 */12 * * *",
  "0 3 * * *",
  "0 4 * * 1",
]
