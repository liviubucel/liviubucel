name: Cloudflare auth diagnostic

on:
  push:
    branches:
      - agent/security-cleanup-20260828

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          package-manager-cache: false

      - name: Enable Corepack
        run: |
          corepack enable
          corepack prepare pnpm@10.34.0 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate Cloudflare token only
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          if pnpm exec wrangler whoami >/dev/null 2>&1; then
            echo 'Cloudflare API token authentication: OK'
          else
            echo '::error::Cloudflare API token authentication failed without using CLOUDFLARE_ACCOUNT_ID.'
            exit 1
          fi

      - name: Validate configured account belongs to token
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          WHOAMI_OUTPUT="$(pnpm exec wrangler whoami 2>&1)"
          if printf '%s' "$WHOAMI_OUTPUT" | grep -Fq -- "$CLOUDFLARE_ACCOUNT_ID"; then
            echo 'Configured Cloudflare account is accessible to the API token: OK'
          else
            echo '::error::CLOUDFLARE_ACCOUNT_ID is not one of the accounts accessible to CLOUDFLARE_API_TOKEN.'
            exit 3
          fi

      - name: Validate D1 access with configured account
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          if pnpm exec wrangler d1 migrations list ROMANIA_MONITOR_DB --remote >/dev/null 2>&1; then
            echo 'Cloudflare D1 read access: OK'
          else
            echo '::error::Account matches the token, but D1 read access fails; token permissions or the D1 resource scope need correction.'
            exit 2
          fi
